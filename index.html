<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Judah's Unblocked Games</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#101522;color:#fff}
header{position:sticky;top:0;z-index:5;background:#171e31;padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #303951}
h1{margin:0;font-size:22px}.coins{margin-left:auto;background:#252e46;padding:8px 12px;border-radius:12px}
button,input,select{font:inherit}button{border:0;border-radius:10px;padding:9px 12px;background:#2d79ff;color:white;cursor:pointer}
button:hover{filter:brightness(1.1)}input,select{background:#20283c;color:#fff;border:1px solid #3b4662;border-radius:9px;padding:9px}
main{max-width:1200px;margin:auto;padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
#games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}
.card{background:#192137;border:1px solid #303a55;border-radius:16px;padding:14px;min-height:180px;display:flex;flex-direction:column}
.card h3{margin:7px 0}.tag{font-size:12px;color:#aab6d2}.spacer{flex:1}.row{display:flex;gap:7px;align-items:center}.fav{background:#3a4053}
#overlay{display:none;position:fixed;inset:0;background:rgba(4,7,14,.94);z-index:20;padding:12px}
.gameWindow{width:min(1100px,100%);height:min(760px,100%);margin:auto;background:#121a2b;border:1px solid #435071;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 80px #000}
.gameTop{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#1b2439}.gameTop strong{font-size:18px}.gameTop .status{margin-left:auto}
#gameCanvas{display:block;width:100%;height:auto;max-height:calc(100vh - 170px);margin:auto;background:#080c16;touch-action:none}
.touch{display:flex;justify-content:center;gap:12px;padding:10px;background:#151e31}.touch button{min-width:60px;font-size:22px;touch-action:none}
#adminPanel{display:none;background:#171e31;border:1px solid #394560;border-radius:14px;padding:15px;margin-bottom:18px}
.adminGrid{display:flex;gap:10px;flex-wrap:wrap}
.small{font-size:12px;color:#aeb9d2}.hidden{display:none}
@media(max-width:600px){main{padding:12px}h1{font-size:18px}.gameWindow{border-radius:10px}.gameTop strong{font-size:14px}}
</style>
</head>
<body>
<header>
<h1>🎮 Judah's Unblocked Games</h1>
<button onclick="showHome()">Home</button>
<button onclick="showFavorites()">❤️ Favorites</button>
<button onclick="toggleAdmin()">🔒 Admin</button>
<div class="coins">🪙 <span id="coinCount">0</span> Judah Coins</div>
</header>

<main>
<div id="adminPanel">
  <b>Admin Controls</b>
  <div class="small">Prototype admin code: JMONEY. For a public site, real authentication should be server-side.</div>
  <div class="adminGrid" style="margin-top:10px">
    <input id="adminCode" placeholder="Admin code">
    <button onclick="unlockAdmin()">Unlock</button>
    <button onclick="addCoins()">+100 Coins</button>
    <button onclick="removeCoins()">-100 Coins</button>
    <button onclick="resetSite()">Reset Site</button>
  </div>
</div>

<div class="toolbar">
<input id="search" placeholder="Search games..." oninput="renderGames()">
<select id="cat" onchange="renderGames()"><option>All</option><option>Action</option><option>Arcade</option><option>Platformer</option><option>Sports</option><option>Puzzle</option></select>
<button onclick="showHome()">🏠 All Games</button>
</div>
<div id="games"></div>
</main>

<div id="overlay">
 <div class="gameWindow">
  <div class="gameTop">
   <button onclick="closeGame()">✕ Exit</button>
   <strong id="gameTitle"></strong>
   <span class="status" id="gameStatus"></span>
  </div>
  <canvas id="gameCanvas" width="900" height="520"></canvas>
  <div class="touch" id="touchControls"></div>
 </div>
</div>

<script>
const games=[
{id:1,name:"Run Run Duck",cat:"Platformer",type:"runner",desc:"Jump, dodge and collect coins!",emoji:"🦆"},
{id:2,name:"Paper Territory",cat:"Action",type:"territory",desc:"Claim territory without hitting your trail!",emoji:"🟦"},
{id:3,name:"Hole Eater",cat:"Arcade",type:"hole",desc:"Eat objects and grow bigger!",emoji:"⚫"},
{id:4,name:"Galaxy Blaster",cat:"Arcade",type:"shooter",desc:"Blast waves of enemy ships!",emoji:"🚀"},
{id:5,name:"Memory Maze",cat:"Puzzle",type:"memory",desc:"Remember the glowing path.",emoji:"🧠"},
{id:6,name:"Mini Golf",cat:"Sports",type:"golf",desc:"Sink the ball in as few shots as possible.",emoji:"⛳"},
{id:7,name:"Target Hunt",cat:"Action",type:"target",desc:"Hit targets before time runs out.",emoji:"🎯"},
{id:8,name:"2048",cat:"Puzzle",type:"2048",desc:"Combine matching tiles.",emoji:"🔢"}
];
let coins=+localStorage.coins||0, favorites=JSON.parse(localStorage.favorites||"[]"), unlocked=false;
let raf=null, keys={}, gameState=null;
const c=document.getElementById("gameCanvas"),ctx=c.getContext("2d");

function save(){localStorage.coins=coins;localStorage.favorites=JSON.stringify(favorites);document.getElementById("coinCount").textContent=coins}
function renderGames(list=games){
 const q=document.getElementById("search").value.toLowerCase(),cat=document.getElementById("cat").value;
 let arr=list.filter(g=>(!q||g.name.toLowerCase().includes(q))&&(cat==="All"||g.cat===cat));
 document.getElementById("games").innerHTML=arr.map(g=>`<div class="card">
 <div style="font-size:42px">${g.emoji}</div><h3>${g.name}</h3><div class="tag">${g.cat}</div><p>${g.desc}</p><div class="spacer"></div>
 <div class="row"><button onclick="startGame(${g.id})">▶ Play</button><button class="fav" onclick="toggleFav(${g.id})">${favorites.includes(g.id)?"❤️":"♡"}</button></div></div>`).join("");
}
function showHome(){document.getElementById("search").value="";document.getElementById("cat").value="All";renderGames()}
function showFavorites(){renderGames(games.filter(g=>favorites.includes(g.id)))}
function toggleFav(id){favorites.includes(id)?favorites=favorites.filter(x=>x!==id):favorites.push(id);save();renderGames()}
function toggleAdmin(){document.getElementById("adminPanel").style.display=document.getElementById("adminPanel").style.display==="block"?"none":"block"}
function unlockAdmin(){if(document.getElementById("adminCode").value==="JMONEY"){unlocked=true;alert("Admin unlocked!")}else alert("Wrong code")}
function addCoins(){if(unlocked){coins+=100;save()}}function removeCoins(){if(unlocked){coins=Math.max(0,coins-100);save()}}
function resetSite(){if(unlocked&&confirm("Reset coins and favorites?")){coins=0;favorites=[];save();renderGames()}}
function openOverlay(title){document.getElementById("overlay").style.display="block";document.getElementById("gameTitle").textContent=title}
function closeGame(){document.getElementById("overlay").style.display="none";if(raf)cancelAnimationFrame(raf);raf=null;keys={};document.getElementById("touchControls").innerHTML=""}
function setStatus(s){document.getElementById("gameStatus").textContent=s}
window.addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))e.preventDefault()});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
function touchButtons(items){
 document.getElementById("touchControls").innerHTML=items.map(x=>`<button data-k="${x.k}">${x.t}</button>`).join("");
 document.querySelectorAll("#touchControls button").forEach(b=>{
  const k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{keys[k]=false}
 });
}
function startGame(id){
 const g=games.find(x=>x.id===id);openOverlay(g.name);
 if(raf)cancelAnimationFrame(raf);
 if(g.type==="runner") runner();
 if(g.type==="territory") territory();
 if(g.type==="hole") hole();
 if(g.type==="shooter") shooter();
 if(g.type==="memory") memory();
 if(g.type==="golf") golf();
 if(g.type==="target") target();
 if(g.type==="2048") game2048();
}

// ---------- RUN RUN DUCK ----------
function runner(){
touchButtons([{k:"arrowleft",t:"◀"},{k:"arrowup",t:"⬆ Jump"},{k:"arrowright",t:"▶"}]);
let p={x:100,y:390,w:34,h:38,vy:0},plats=[{x:0,y:445,w:900,h:75},{x:220,y:360,w:150,h:18},{x:500,y:300,w:150,h:18},{x:720,y:390,w:120,h:18}],obs=[{x:430,y:410,w:30,h:35},{x:650,y:410,w:30,h:35}],coinsA=[{x:260,y:325},{x:540,y:265},{x:750,y:355}],score=0,done=false;
function loop(){
ctx.clearRect(0,0,900,520);ctx.fillStyle="#8bd3ff";ctx.fillRect(0,0,900,520);
ctx.fillStyle="#4c9b4c";plats.forEach(a=>ctx.fillRect(a.x,a.y,a.w,a.h));
ctx.fillStyle="#ff4b4b";obs.forEach(a=>ctx.fillRect(a.x,a.y,a.w,a.h));
ctx.font="30px Arial";coinsA.forEach(a=>ctx.fillText("🪙",a.x,a.y));
ctx.fillStyle="#ffd84d";ctx.fillRect(p.x,p.y,p.w,p.h);ctx.font="28px Arial";ctx.fillText("🦆",p.x-2,p.y+30);
if(keys.arrowleft)p.x-=4;if(keys.arrowright)p.x+=4;if((keys.arrowup||keys[" "])&&p.onGround){p.vy=-12;p.onGround=false}
p.vy+=.55;p.y+=p.vy;p.onGround=false;
plats.forEach(a=>{if(p.x+p.w>a.x&&p.x<a.x+a.w&&p.y+p.h>=a.y&&p.y+p.h<=a.y+18&&p.vy>=0){p.y=a.y-p.h;p.vy=0;p.onGround=true}});
obs.forEach(a=>{if(p.x<a.x+a.w&&p.x+p.w>a.x&&p.y<a.y+a.h&&p.y+p.h>a.y){done=true}});
coinsA=coinsA.filter(a=>{let hit=p.x<a.x+22&&p.x+p.w>a.x&&p.y<a.y+22&&p.y+p.h>a.y;if(hit)score+=10;return !hit});
if(p.x>850){score+=50;p.x=40}
if(p.y>520||done){setStatus("Game over! Score "+score+" — press Exit and Play again");return}
setStatus("Score: "+score+" • Reach the right side!");
raf=requestAnimationFrame(loop)} loop()
}

// ---------- PAPER TERRITORY ----------
function territory(){
touchButtons([{k:"arrowleft",t:"◀"},{k:"arrowup",t:"▲"},{k:"arrowdown",t:"▼"},{k:"arrowright",t:"▶"}]);
let p={x:450,y:260,dx:0,dy:0},trail=[],area=[],score=0,t=0,dead=false;
function loop(){
t++;ctx.fillStyle="#0b1020";ctx.fillRect(0,0,900,520);
ctx.fillStyle="#183b62";ctx.fillRect(0,0,900,520);
ctx.fillStyle="#35a7ff";area.forEach(a=>ctx.fillRect(a.x,a.y,10,10));
if(keys.arrowleft)p.dx=-3.2,p.dy=0;if(keys.arrowright)p.dx=3.2,p.dy=0;if(keys.arrowup)p.dy=-3.2,p.dx=0;if(keys.arrowdown)p.dy=3.2,p.dx=0;
p.x=Math.max(5,Math.min(885,p.x+p.dx));p.y=Math.max(5,Math.min(505,p.y+p.dy));
trail.push({x:p.x,y:p.y});if(trail.length>120)trail.shift();
ctx.fillStyle="#fff";trail.forEach(a=>ctx.fillRect(a.x,a.y,5,5));ctx.fillStyle="#ffd43b";ctx.fillRect(p.x-5,p.y-5,10,10);
if(t%180===0){score+=Math.max(1,Math.floor(trail.length/15));area.push(...trail.map(a=>({x:Math.floor(a.x/10)*10,y:Math.floor(a.y/10)*10})));trail=[]}
setStatus("Territory: "+score+"% • Build a trail, then return to your area!");
raf=requestAnimationFrame(loop)}loop()
}

// ---------- HOLE EATER ----------
function hole(){
touchButtons([{k:"arrowleft",t:"◀"},{k:"arrowup",t:"▲"},{k:"arrowdown",t:"▼"},{k:"arrowright",t:"▶"}]);
let p={x:450,y:260,r:18},objs=[],score=0,t=0;
for(let i=0;i<45;i++)objs.push({x:20+Math.random()*860,y:20+Math.random()*480,r:5+Math.random()*12,kind:Math.random()<.7?"dot":"big"});
function loop(){
t++;ctx.fillStyle="#12162a";ctx.fillRect(0,0,900,520);
if(keys.arrowleft)p.x-=4;if(keys.arrowright)p.x+=4;if(keys.arrowup)p.y-=4;if(keys.arrowdown)p.y+=4;
p.x=Math.max(p.r,Math.min(900-p.r,p.x));p.y=Math.max(p.r,Math.min(520-p.r,p.y));
objs=objs.filter(o=>{let d=Math.hypot(p.x-o.x,p.y-o.y);if(d<p.r&&o.r<p.r*.9){score+=o.kind==="big"?25:10;p.r+=o.r*.06;return false}return true});
ctx.fillStyle="#5e2a84";objs.forEach(o=>{ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill()});
ctx.fillStyle="#050505";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.strokeStyle="#fff";ctx.stroke();
setStatus("Score: "+score+" • Size: "+Math.floor(p.r));raf=requestAnimationFrame(loop)}loop()
}

// ---------- GALAXY BLASTER ----------
function shooter(){
touchButtons([{k:"arrowleft",t:"◀"},{k:" ",t:"🔴 Fire"},{k:"arrowright",t:"▶"}]);
let p={x:450,y:465},bul=[],en=[],score=0,last=0,over=false;
function loop(t){
ctx.fillStyle="#050816";ctx.fillRect(0,0,900,520);ctx.fillStyle="#fff";
for(let i=0;i<70;i++)ctx.fillRect((i*137)%900,(i*73)%520,2,2);
if(keys.arrowleft)p.x-=6;if(keys.arrowright)p.x+=6;p.x=Math.max(20,Math.min(880,p.x));
if((keys[" "]||keys.z)&&t-last>180){bul.push({x:p.x,y:p.y-20});last=t}
if(Math.random()<.025)en.push({x:20+Math.random()*860,y:-20,vy:1.5+Math.random()*1.5});
bul.forEach(b=>b.y-=8);en.forEach(e=>e.y+=e.vy);
for(let i=en.length-1;i>=0;i--)for(let j=bul.length-1;j>=0;j--)if(Math.hypot(en[i].x-bul[j].x,en[i].y-bul[j].y)<22){en.splice(i,1);bul.splice(j,1);score+=10;break}
if(en.some(e=>Math.hypot(e.x-p.x,e.y-p.y)<25)||en.some(e=>e.y>520))over=true;
ctx.font="30px Arial";ctx.fillText("🚀",p.x-15,p.y+10);ctx.fillText("•",0,0);ctx.font="25px Arial";bul.forEach(b=>ctx.fillText("│",b.x,b.y));en.forEach(e=>ctx.fillText("👾",e.x-15,e.y+10));
if(over){setStatus("Game over! Score "+score);return}setStatus("Score: "+score+" • Move + shoot!");raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop)
}

// ---------- MEMORY ----------
function memory(){
touchButtons([]);let seq=[],shown=[],round=1,clickable=false;
function newRound(){seq=[];for(let i=0;i<round+2;i++)seq.push(Math.floor(Math.random()*12));shown=[];clickable=false;setStatus("Watch the sequence...");let i=0;let timer=setInterval(()=>{drawMemory(i<seq.length?seq[i]:-1);i++;if(i>seq.length){clearInterval(timer);clickable=true;setStatus("Tap the squares in order!")}},450)}
function drawMemory(active=-1){ctx.fillStyle="#101522";ctx.fillRect(0,0,900,520);for(let i=0;i<12;i++){let x=250+(i%4)*105,y=90+Math.floor(i/4)*105;ctx.fillStyle=i===active?"#fff":"#33405d";ctx.fillRect(x,y,80,80)}}
c.onclick=e=>{if(!clickable)return;let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*900/r.width,y=(e.clientY-r.top)*520/r.height,col=Math.floor((x-250)/105),row=Math.floor((y-90)/105),n=row*4+col;if(n>=0&&n<12){shown.push(n);if(n!==seq[shown.length-1]){setStatus("Wrong! Round "+round);clickable=false}else if(shown.length===seq.length){round++;coins+=5;save();setTimeout(newRound,600)}}};newRound()
}

// ---------- GOLF ----------
function golf(){
touchButtons([{k:"arrowleft",t:"◀ Aim"},{k:"arrowright",t:"Aim ▶"},{k:" ",t:"⛳ Shoot"}]);
let b={x:100,y:430,vx:0,vy:0},hole={x:780,y:100,r:18},shots=0,aim=-.8,power=0,charging=false;
function loop(){
ctx.fillStyle="#27733b";ctx.fillRect(0,0,900,520);ctx.fillStyle="#5bbf65";ctx.fillRect(20,20,860,480);
ctx.fillStyle="#222";ctx.beginPath();ctx.arc(hole.x,hole.y,hole.r,0,7);ctx.fill();
if(!b.vx&&!b.vy){if(keys.arrowleft)aim-=.025;if(keys.arrowright)aim+=.025;if(keys[" "]&&!charging){charging=true;power=0}else if(charging){power+=1;if(!keys[" "]){b.vx=Math.cos(aim)*power*.18;b.vy=Math.sin(aim)*power*.18;shots++;charging=false}}}
b.x+=b.vx;b.y+=b.vy;b.vx*=.985;b.vy*=.985;if(b.x<30||b.x>870)b.vx*=-1;if(b.y<30||b.y>490)b.vy*=-1;
ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(b.x,b.y,9,0,7);ctx.fill();
if(Math.hypot(b.x-hole.x,b.y-hole.y)<hole.r){setStatus("Hole in "+shots+" shots! +50 coins");coins+=50;save();return}
setStatus("Shots: "+shots+" • Aim with ◀ ▶, hold Space, release to shoot");raf=requestAnimationFrame(loop)}loop()
}

// ---------- TARGET ----------
function target(){
touchButtons([]);let score=0,time=20,target={x:450,y:260,r:30};c.onclick=e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*900/r.width,y=(e.clientY-r.top)*520/r.height;if(Math.hypot(x-target.x,y-target.y)<target.r){score++;target.x=40+Math.random()*820;target.y=40+Math.random()*440}};let start=Date.now();
function loop(){ctx.fillStyle="#121827";ctx.fillRect(0,0,900,520);ctx.fillStyle="#ff405e";ctx.beginPath();ctx.arc(target.x,target.y,target.r,0,7);ctx.fill();let left=Math.max(0,20-Math.floor((Date.now()-start)/1000));setStatus("Targets: "+score+" • Time: "+left);if(left<=0){setStatus("Time! Score "+score);return}raf=requestAnimationFrame(loop)}loop()
}

// ---------- 2048 ----------
function game2048(){
touchButtons([{k:"arrowleft",t:"◀"},{k:"arrowup",t:"▲"},{k:"arrowdown",t:"▼"},{k:"arrowright",t:"▶"}]);
let a=Array.from({length:4},()=>Array(4).fill(0));function add(){let e=[];a.forEach((r,i)=>r.forEach((v,j)=>{if(!v)e.push([i,j])}));if(e.length){let p=e[Math.floor(Math.random()*e.length)];a[p[0]][p[1]]=Math.random()<.9?2:4}}
function move(dir){let old=JSON.stringify(a);function line(r){r=r.filter(Boolean);for(let i=0;i<r.length-1;i++)if(r[i]===r[i+1]){r[i]*=2;r.splice(i+1,1);coins++;}while(r.length<4)r.push(0);return r}
if(dir==="left")a=a.map(line);if(dir==="right")a=a.map(r=>line(r.reverse()).reverse());
if(dir==="up"){for(let j=0;j<4;j++){let r=line(a.map(x=>x[j]));for(let i=0;i<4;i++)a[i][j]=r[i]}}
if(dir==="down"){for(let j=0;j<4;j++){let r=line(a.map(x=>x[j]).reverse()).reverse();for(let i=0;i<4;i++)a[i][j]=r[i]}}
if(old!==JSON.stringify(a)){add();save()}}
window.addEventListener("keydown",function h(e){if(document.getElementById("overlay").style.display!=="block")return;let d={"arrowleft":"left","arrowright":"right","arrowup":"up","arrowdown":"down"}[e.key.toLowerCase()];if(d)move(d)});
function draw(){ctx.fillStyle="#1c2435";ctx.fillRect(0,0,900,520);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let x=210+j*125,y=10+i*125;ctx.fillStyle="#303a52";ctx.fillRect(x,y,110,110);if(a[i][j]){ctx.fillStyle="#fff";ctx.font="bold 30px Arial";ctx.fillText(a[i][j],x+35,y+65)}}setStatus("Use arrow keys / buttons • Coins: "+coins);raf=requestAnimationFrame(draw)}add();add();draw()
}
save();renderGames();
</script>
</body>
</html>
